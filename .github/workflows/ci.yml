name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # next build/prisma generate only need a syntactically valid connection
      # string, not a reachable database — no real secret required here.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci"
      JWT_SECRET: "ci-only-placeholder-secret-not-used-in-prod-32chars"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Obavezno: greške lint-a obaraju build (upozorenja ne).
      - run: npm run lint

      - run: npm test

      - run: npm run build
